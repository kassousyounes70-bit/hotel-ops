if(!ENV_ERR){firebase.initializeApp(CONFIG.firebase);auth=firebase.auth();fs=firebase.firestore();FV=firebase.firestore.FieldValue;try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}
const col=n=>fs.collection('hotels').doc(CONFIG.hotelId).collection(n);
const DEFAULT_SETTINGS=()=>({payments:{cash:0,card:0},expenses:[],shift:{drawer:CONFIG.startingDrawer,start:hhmm()},handover:null,nextSeq:1});
const EMPTY={rooms:[],guests:[],incidents:[],attendance:[],blacklist:[],settings:null,ready:{}};

function useHotel(user,onError){
  const [d,setD]=useState(EMPTY);
  const er=useRef(onError);er.current=onError;
  useEffect(()=>{
    if(!user){setD(EMPTY);return}
    const un=[];
    const sub=(q,key,map)=>un.push(q.onSnapshot(sn=>setD(p=>({...p,[key]:sn.docs.map(map),ready:{...p.ready,[key]:true}})),e=>er.current(e)));
    sub(col('rooms'),'rooms',x=>({...x.data(),id:Number(x.id)}));
    sub(col('guests').where('active','==',true),'guests',x=>({...x.data(),id:x.id}));
    sub(col('incidents'),'incidents',x=>({...x.data(),id:x.id}));
    sub(col('attendance'),'attendance',x=>({...x.data(),id:x.id}));
    sub(col('blacklist'),'blacklist',x=>({...x.data(),id:x.id}));
    un.push(col('settings').doc('current').onSnapshot(sn=>setD(p=>({...p,settings:sn.exists?sn.data():null,ready:{...p.ready,settings:true}})),e=>er.current(e)));
    return()=>un.forEach(f=>f());
  },[user&&user.uid]);
  const A=useMemo(()=>{
    if(!user)return null;
    const w=f=>(...a)=>{try{const r=f(...a);if(r&&r.catch)r.catch(e=>er.current(e));return r}catch(e){er.current(e)}};
    const S=()=>col('settings').doc('current');
    return{
      checkIn:w((g,method,amount,next)=>{const b=fs.batch();
        b.set(col('guests').doc(uid()),{...g,active:true,ts:Date.now(),by:user.name});
        b.update(col('rooms').doc(String(g.room)),{status:'occupied'});
        b.set(S(),{payments:{[method]:FV.increment(amount)},nextSeq:next},{merge:true});return b.commit()}),
      setRoom:w((id,status,guests)=>{const b=fs.batch();
        b.update(col('rooms').doc(String(id)),{status});
        guests.filter(g=>g.room===id).forEach(g=>b.update(col('guests').doc(g.id),{active:false,outAt:Date.now()}));return b.commit()}),
      addBlack:w((docId,reason)=>col('blacklist').doc(uid()).set({docId,reason,ts:Date.now()})),
      rmBlack:w(id=>col('blacklist').doc(id).delete()),
      startShift:w(()=>col('attendance').doc(uid()).set({uid:user.uid,name:user.name,date:ymd(),start:hhmm(),end:null,ts:Date.now()})),
      endShift:w(id=>col('attendance').doc(id).update({end:hhmm()})),
      addExpense:w((label,amount)=>S().set({expenses:FV.arrayUnion({id:uid(),label,amount})},{merge:true})),
      closeShift:w((handover,actual,record)=>{const b=fs.batch();
        b.set(S(),{handover,payments:{cash:0,card:0},expenses:[],shift:{drawer:actual,start:hhmm()}},{merge:true});
        b.set(col('shifts').doc(uid()),{...record,uid:user.uid,ts:Date.now()});return b.commit()}),
      addIncident:w(o=>col('incidents').doc(uid()).set({...o,resolved:false,time:hhmm(),by:user.name,ts:Date.now()})),
      resolveIncident:w(id=>col('incidents').doc(id).update({resolved:true})),
      initRooms:w(()=>{const b=fs.batch();
        CONFIG.floors.forEach(f=>{for(let n=1;n<=CONFIG.roomsPerFloor;n++)b.set(col('rooms').doc(String(f*100+n)),{floor:f,status:'vacant'})});
        b.set(S(),DEFAULT_SETTINGS(),{merge:true});return b.commit()}),
    };
  },[user&&user.uid]);
  const st=d.settings||{};
  const s={
    rooms:[...d.rooms].sort((a,b)=>a.id-b.id),
    guests:[...d.guests].sort((a,b)=>(b.ts||0)-(a.ts||0)),
    incidents:[...d.incidents].sort((a,b)=>(b.ts||0)-(a.ts||0)),
    attendance:[...d.attendance].sort((a,b)=>(b.ts||0)-(a.ts||0)),
    blacklist:d.blacklist,
    payments:{cash:(st.payments&&st.payments.cash)||0,card:(st.payments&&st.payments.card)||0},
    expenses:st.expenses||[],
    shift:st.shift||{drawer:CONFIG.startingDrawer,start:CONFIG.shiftStart},
    handover:st.handover||null,
    nextSeq:st.nextSeq||1,
  };
  return{s,ready:d.ready,A};
}

const inp="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-deep px-3 py-2.5";
const btn="rounded-lg px-4 py-2.5 font-medium bg-brass text-ink hover:brightness-110 active:brightness-95";
const btn2="rounded-lg px-4 py-2.5 font-medium border border-slate-300 dark:border-slate-600 hover:bg-slate-200/60 dark:hover:bg-slate-700/40";
const Card=({title,children,className=''})=>(
  <section className={'rounded-xl bg-white dark:bg-deep border border-slate-200 dark:border-slate-700/60 p-4 '+className}>
    {title&&<h2 className="font-serif text-lg mb-3">{title}</h2>}{children}
  </section>);
const Field=({label,children})=>(<label className="block"><span className="text-sm text-slate-500 dark:text-slate-400">{label}</span><div className="mt-1">{children}</div></label>);
const Sev=({v})=>{const {t}=useL();return <span className={'rounded-full px-2 py-0.5 text-xs font-medium '+SEVC[v||'low']}>{t(v==='critical'?'Critical':v==='medium'?'Medium':'Low')}</span>};

function Police({s,onClose}){

  const now=new Date();const list=[...s.guests].sort((a,b)=>a.seq-b.seq);
  const fd=d=>d?d.split('-').reverse().join('/'):'—';
  useEffect(()=>{const f=()=>{const k=Math.min(1,(window.innerWidth-24)/1123);setSc(k);if(ref.current)setH(ref.current.offsetHeight*k)};f();window.addEventListener('resize',f);return()=>window.removeEventListener('resize',f)},[list.length]);
  const th="border border-black px-1 py-1 text-left font-semibold break-words";const td="border border-black px-1 py-1 align-top break-words";

    </div>
    <div className="police-box mx-auto" style={{width:1123*sc,height:h||undefined}}>
      <div id="police" ref={ref} dir="ltr" className="bg-white text-black shadow-xl" style={{width:'297mm',minHeight:'210mm',boxSizing:'border-box',padding:'10mm',fontFamily:'Georgia,serif',fontSize:'11px',transformOrigin:'top left',transform:'scale('+sc+')'}}>
        <div className="flex justify-between items-end border-b-2 border-black pb-2 mb-3">
          <div><div style={{fontSize:'22px',fontWeight:700}}>{CONFIG.name}</div><div>Fiche de Police — Registre des voyageurs</div></div>
          <div style={{textAlign:'right'}}>Édité le {now.toLocaleDateString('fr-FR')} à {hhmm()}<br/>Clients présents : {list.length}</div>
        </div>
        <table style={{width:'100%',tableLayout:'fixed',borderCollapse:'collapse',fontSize:'11px'}}>
          <colgroup>{cols.map((w,i)=><col key={i} style={{width:w+'%'}}/>)}</colgroup>
          <thead><tr>{['N°','Nom et prénom','Naissance (date, lieu)','Nationalité',"Pièce d'identité",'Adresse','Chambre','Arrivée','Départ prévu'].map(x=><th key={x} className={th}>{x}</th>)}</tr></thead>
          <tbody>{list.map(g=>(<tr key={g.id}><td className={td}>{g.seq}</td><td className={td}>{g.name}</td><td className={td}>{fd(g.dob)}<br/>{g.pob||''}</td><td className={td}>{tf(g.nat||'')||'—'}</td><td className={td}>{tf(g.docType)}<br/>{g.docId}</td><td className={td}>{g.address||'—'}</td><td className={td+' font-bold'}>{g.room}</td><td className={td}>{fd(g.inDate)}<br/>{g.time}</td><td className={td}>{fd(g.outDate)}</td></tr>))}</tbody>
        </table>
        {list.length===0&&<p style={{marginTop:'12px'}}>Aucun client présent.</p>}
        <div className="flex justify-between" style={{marginTop:'24px',breakInside:'avoid',pageBreakInside:'avoid'}}><div>Le réceptionniste : ______________</div><div>Cachet et signature de la direction : ______________</div></div>
      </div></div></div>);
}

      <div className="mt-4 grid grid-cols-3 gap-2 text-center">
        {[['Total',total],['Vacant',vac],['Maintenance',mnt]].map(([l,v])=>(<div key={l} className="rounded-lg bg-slate-100 dark:bg-ink/60 py-2"><div className="text-2xl font-semibold">{v}</div><div className="text-xs text-slate-500 dark:text-slate-400">{t(l)}</div></div>))}
      </div>

    </Card>

      <div className="flex justify-between text-lg"><span>{t('Cash')} <b>{money(cash)}</b></span><span>{t('Card')} <b>{money(card)}</b></span></div>

function ReceptionTab({s,toast}){
  const {t,cur,A}=useL();
  const free=s.rooms.filter(r=>r.status==='vacant');
  const blank={docType:CONFIG.docTypes[0],docId:'',name:'',dob:'',pob:'',nat:'',address:'',phone:'',plate:'',room:'',services:[],seq:s.nextSeq,outDate:addDays(1),amount:CONFIG.rate,method:'cash'};
  const [f,setF]=useState(blank);const [q,setQ]=useState('');
  useEffect(()=>{setF(x=>({...x,seq:s.nextSeq}))},[s.nextSeq]);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const tog=v=>set('services',f.services.includes(v)?f.services.filter(x=>x!==v):[...f.services,v]);
  const dupe=f.docId.trim()&&s.guests.find(g=>lc(g.docId)===lc(f.docId));
  const black=f.docId.trim()&&s.blacklist.find(b=>lc(b.docId)===lc(f.docId));
  const submit=e=>{e.preventDefault();
    if(!f.name||!f.docId||!f.room){toast(t('Fill in name, document number and room.'));return}

    const room=Number(f.room);
    const rm=s.rooms.find(x=>x.id===room);
    if(!rm||rm.status!=='vacant'){toast(t('This room is no longer available.'));set('room','');return}
    A.checkIn({seq:Number(f.seq),docType:f.docType,docId:f.docId.trim(),name:f.name,dob:f.dob,pob:f.pob,nat:f.nat,address:f.address,phone:f.phone,plate:f.plate,room,services:f.services,time:hhmm(),inDate:ymd(),outDate:f.outDate,paidAmount:Number(f.amount||0),paidMethod:f.method},f.method,Number(f.amount||0),Number(f.seq)+1);
    setF({...blank,seq:Number(f.seq)+1});toast(t('Guest checked in to room {0}.',room));};
  const list=s.guests.filter(g=>(g.name+g.room).toLowerCase().includes(q.toLowerCase()));

  return(<div className="grid gap-4 lg:grid-cols-5">
    <Card title={t('Quick check-in')} className="lg:col-span-2 self-start">
      <form onSubmit={submit} className="space-y-3">

          <Field label={t('Entry no.')}><input type="number" className={inp} value={f.seq} onChange={e=>set('seq',e.target.value)}/></Field>

        </div>

        {black&&<div role="alert" className="rounded-lg p-3 text-sm bg-red-500/20 text-red-700 dark:text-red-300">⚠ {t('Blacklisted: {0}',black.reason?t(black.reason):black.docId)}</div>}
        <Field label={t('Full name')}><input className={inp} value={f.name} onChange={e=>set('name',e.target.value)} autoComplete="off"/></Field>
        <div className="grid grid-cols-2 gap-3">

          <Field label={t('Place of birth')}><input className={inp} value={f.pob} onChange={e=>set('pob',e.target.value)}/></Field>

        </div>
        <Field label={t('Address')}><input className={inp} value={f.address} onChange={e=>set('address',e.target.value)}/></Field>

      {list.length===0&&<p className="text-slate-500">{t('No guests match your search.')}</p>}
      <div className="hidden md:block overflow-x-auto"><table className="w-full text-sm text-start">
        <thead className="text-slate-500 dark:text-slate-400"><tr>{['No.','Guest','Document','Room','Services','Out'].map(h=><th key={h} className="py-2 pe-3 font-medium text-start">{t(h)}</th>)}</tr></thead>
        <tbody>{list.map(g=>(<tr key={g.id} className="border-t border-slate-200 dark:border-slate-700/60"><td className="py-2 pe-3">{g.seq}</td><td className="pe-3"><div className="font-medium">{g.name}</div><div className="text-slate-500" dir="ltr">{g.phone}</div></td><td className="pe-3">{t(g.docType)}<div className="text-slate-500">{g.docId}</div></td><td className="pe-3 font-semibold">{g.room}</td><td className="pe-3">{sv(g)||'—'}</td><td>{g.outDate||'—'}</td></tr>))}</tbody>
      </table></div>
      <div className="md:hidden space-y-2">{list.map(g=>(<div key={g.id} className="rounded-lg bg-slate-100 dark:bg-ink/60 p-3 text-sm"><div className="flex justify-between"><b>{g.name}</b><b>{t('Room {0}',g.room)}</b></div><div className="text-slate-500">#{g.seq} · {t(g.docType)} {g.docId}</div><div className="text-slate-500"><span dir="ltr">{g.phone}</span> · {t('Out')}: {g.outDate||'—'}</div>{g.services.length>0&&<div>{sv(g)}</div>}</div>))}</div>
    </Card>
  </div>);
}

function RoomsTab({s,toast}){
  const {t,A}=useL();
  const [sel,setSel]=useState(null);
  const sw=useRef(null),swiped=useRef(false);
  const room=s.rooms.find(r=>r.id===sel);
  const guest=room&&s.guests.find(g=>g.room===room.id);
  const setRoom=(id,st)=>A.setRoom(id,st,s.guests);
  const change=(st)=>{setRoom(sel,st);toast(t('Room {0}: {1}.',sel,t(STATUS[st].label)));setSel(null)};
  const checkout=()=>{setRoom(sel,'dirty');toast(t('Room {0} checked out. Marked for housekeeping.',sel));setSel(null)};
  const advance=r=>{
    if(r.status==='occupied'){setRoom(r.id,'dirty');toast(t('Room {0} checked out. Marked for housekeeping.',r.id))}
    else if(r.status==='dirty'){setRoom(r.id,'vacant');toast(t('Room {0}: {1}.',r.id,t(STATUS.vacant.label)))}
    else if(r.status==='oos'){setRoom(r.id,'dirty');toast(t('Room {0}: {1}.',r.id,t(STATUS.dirty.label)))}
    else toast(t('Room {0} is clean and vacant. Use the room menu for other changes.',r.id));
  };
  const down=(e,r)=>{sw.current={x:e.clientX,y:e.clientY,id:r.id}};
  const up=(e,r)=>{const a=sw.current;sw.current=null;if(!a||a.id!==r.id)return;const dx=e.clientX-a.x,dy=Math.abs(e.clientY-a.y);if(Math.abs(dx)>60&&dy<40){swiped.current=true;advance(r)}};
  const click=r=>{if(swiped.current){swiped.current=false;return}setSel(r.id)};
  return(<div>
    <div className="flex flex-wrap gap-4 mb-2 text-sm">{Object.entries(STATUS).map(([k,v])=>(<span key={k} className="flex items-center gap-2"><span className={'h-3 w-3 rounded-full '+v.dot}></span>{t(v.label)}</span>))}</div>

      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">{s.rooms.filter(r=>r.floor===f).map(r=>{const g=s.guests.find(x=>x.room===r.id);return(
        <button key={r.id} style={{touchAction:'pan-y'}} onPointerDown={e=>down(e,r)} onPointerUp={e=>up(e,r)} onClick={()=>click(r)} className={'rounded-xl border-2 p-3 text-start min-h-[84px] select-none '+STATUS[r.status].card}>
          <div className="text-xl font-semibold">{r.id}</div>
          <div className="text-xs mt-1 truncate text-slate-600 dark:text-slate-300">{g?g.name:t(STATUS[r.status].label)}</div>
        </button>)})}</div></div>))}
    {room&&(<div className="fixed inset-0 z-40 bg-black/60 flex items-end sm:items-center justify-center p-3" onClick={()=>setSel(null)}>
      <div className="w-full max-w-md rounded-2xl bg-white dark:bg-deep p-5 max-h-[90vh] overflow-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-start"><div><h3 className="font-serif text-2xl">{t('Room {0}',room.id)}</h3><div className="flex items-center gap-2 text-sm mt-1"><span className={'h-3 w-3 rounded-full '+STATUS[room.status].dot}></span>{t(STATUS[room.status].label)}</div></div><button className="text-2xl leading-none px-2" aria-label={t('Close')} onClick={()=>setSel(null)}>×</button></div>
        {guest&&(<div className="mt-4 rounded-lg bg-slate-100 dark:bg-ink/60 p-3 text-sm space-y-1"><div className="font-semibold text-base">{guest.name}</div><div dir="ltr" className="text-start">{guest.phone}</div><div>{t(guest.docType)}: {guest.docId}</div>
          {(guest.dob||guest.pob)&&<div>{t('Date of birth')}: {guest.dob||'—'} · {guest.pob||'—'}</div>}{guest.nat&&<div>{t('Nationality')}: {t(guest.nat)}</div>}{guest.address&&<div>{t('Address')}: {guest.address}</div>}{guest.plate&&<div>{t('Vehicle plate (optional)')}: <span dir="ltr">{guest.plate}</span></div>}
          <div>{t('Services: {0}',guest.services.map(t).join(', ')||t('none'))}</div><div>{t('Checked in at {0} · entry no. {1}',guest.time,guest.seq)}</div>{guest.outDate&&<div>{t('Expected check-out')}: {guest.outDate}</div>}</div>)}

function ShiftTab({s,toast}){

function App(){
  const [tab,setTab]=useState('dash');
  const [user,setUser]=useState(undefined);
  const [authErr,setAuthErr]=useState(null);
  const [lang,setLang]=useState(()=>{try{return localStorage.getItem('hotel:lang')||CONFIG.defaultLang}catch(e){return CONFIG.defaultLang}});
  const [dark,setDark]=useState(()=>{try{return localStorage.getItem('hotel:theme')!=='light'}catch(e){return true}});
  const [msg,setMsg]=useState('');
  const [police,setPolice]=useState(false);
  const [online,setOnline]=useState(navigator.onLine);
  const last=useRef(Date.now());
  const cur=CONFIG.currency[lang];
  const t=(k,...a)=>{let v=lang==='en'?k:(D[k]?D[k][lang==='fr'?0:1]:k);a.forEach((x,i)=>{v=v.split('{'+i+'}').join(x)});return v};
  const tf=k=>D[k]?D[k][0]:k;
  const money=n=>Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+'\u00a0'+cur;
  const errH=e=>{if(!e)return;setMsg(t('Could not save: {0}',e.code==='permission-denied'?t('permission denied'):(e.code||e.message||'')))};
  const {s,ready,A}=useHotel(user||null,errH);
  const isMgr=!!user&&user.role==='manager';
  const tabs=isMgr?TABS:TABS.filter(x=>x[0]!=='dash'&&x[0]!=='arch');
  useEffect(()=>{if(ENV_ERR)return;const un=auth.onAuthStateChanged(async u=>{
    if(!u){setUser(null);return}
    try{
      const sn=await col('staff').doc(u.uid).get();
      const d=sn.exists?sn.data():null;
      if(d&&d.active===true){setUser({uid:u.uid,email:u.email,name:d.name||u.email,role:d.role==='manager'?'manager':'receptionist'})}
      else{setAuthErr({k:'unauthorized',n:Date.now()});setUser(null);auth.signOut()}
    }catch(e){
      setAuthErr({k:e&&e.code==='permission-denied'?'unauthorized':'network',n:Date.now()});setUser(null);auth.signOut();
    }
  });
  const tm=setTimeout(()=>{setUser(u=>{if(u===undefined){setAuthErr({k:'network',n:Date.now()});return null}return u})},10000);
  return()=>{un();clearTimeout(tm)}},[]);
  useEffect(()=>{if(user)setTab(user.role==='manager'?'dash':'desk')},[user&&user.uid]);
  useEffect(()=>{document.documentElement.classList.toggle('dark',dark);try{localStorage.setItem('hotel:theme',dark?'dark':'light')}catch(e){}},[dark]);
  useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';try{localStorage.setItem('hotel:lang',lang)}catch(e){}},[lang]);
  useEffect(()=>{if(!msg)return;const x=setTimeout(()=>setMsg(''),2800);return()=>clearTimeout(x)},[msg]);
  useEffect(()=>{const a=()=>setOnline(true),b=()=>setOnline(false);window.addEventListener('online',a);window.addEventListener('offline',b);return()=>{window.removeEventListener('online',a);window.removeEventListener('offline',b)}},[]);
  useEffect(()=>{const bump=()=>{last.current=Date.now()};const ev=['pointerdown','keydown','touchstart'];ev.forEach(e=>window.addEventListener(e,bump));
    const iv=setInterval(()=>{if(user&&user.role!=='manager'&&Date.now()-last.current>CONFIG.lockMinutes*60000)auth.signOut()},5000);
    return()=>{ev.forEach(e=>window.removeEventListener(e,bump));clearInterval(iv)}},[user&&user.uid]);
  const ctx={t,tf,money,cur,isMgr,A,user};
  if(ENV_ERR)return(<Ctx.Provider value={ctx}><div className="min-h-screen grid place-items-center p-6 text-center"><div className="max-w-sm"><div className="text-4xl mb-3">⚠</div><p>{t(ENV_ERR==='sdk'?'Could not load Firebase. Check your internet connection and open the website address.':'This app must be opened from its website address (https), not as a local file.')}</p></div></div></Ctx.Provider>);
  if(user===undefined)return(<Ctx.Provider value={ctx}><div className="min-h-screen grid place-items-center text-slate-500">{t('Loading…')}</div></Ctx.Provider>);
  if(!user)return(<Ctx.Provider value={ctx}><Login lang={lang} setLang={setLang} dark={dark} setDark={setDark} err={authErr}/></Ctx.Provider>);
  const P={s,toast:setMsg};
  const alerts=s.incidents.filter(needsAttention).length;
  const title=TABS.find(x=>x[0]===tab)[1];
  const noRooms=ready.rooms&&s.rooms.length===0;
  return(<Ctx.Provider value={ctx}><div className="md:flex min-h-screen">
    <aside className="hidden md:flex md:flex-col w-56 shrink-0 bg-ink text-slate-200 p-4 sticky top-0 h-screen">
      <div className="flex items-center gap-3 mb-8"><div className="h-10 w-10 rounded-lg bg-brass text-ink grid place-items-center font-serif text-xl font-bold">{CONFIG.mark}</div><div><div className="font-serif leading-tight">{CONFIG.name}</div></div></div>
      <nav className="space-y-1">{tabs.map(([k,l,i])=>(<button key={k} onClick={()=>setTab(k)} className={'w-full text-start rounded-lg px-3 py-2.5 flex gap-3 '+(tab===k?'bg-brass text-ink font-medium':'hover:bg-white/10')}><span className="w-4 text-center">{i}</span>{t(l)}</button>))}</nav>
    </aside>
    <div className="flex-1 min-w-0 pb-24 md:pb-8">
      {isMgr&&alerts>0&&tab!=='inc'&&<div role="alert" className="flex items-center justify-between gap-3 bg-red-600 text-white px-4 py-2.5 text-sm"><span>⚠ {t('{0} incident(s) need your attention',alerts)}</span><button className="rounded-md bg-white/20 px-3 py-1" onClick={()=>setTab('inc')}>{t('View')}</button></div>}
      <header className="flex items-center justify-between gap-3 px-4 md:px-8 py-4">
        <div><h1 className="font-serif text-2xl md:text-3xl">{t(title)}</h1><div className="md:hidden text-sm text-slate-500 dark:text-slate-400">{CONFIG.name}</div>
          <div className="mt-1 flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400"><span className={'h-2.5 w-2.5 rounded-full '+(online?'bg-emerald-500 animate-pulse':'bg-red-500')}></span>{online?t('Live'):t('Offline — changes are saved on this device')}</div></div>
        <div className="flex flex-wrap justify-end items-center gap-2">
          <div className="text-end leading-tight me-1"><div className="text-sm font-medium">{user.name}</div><div className="text-xs text-slate-500 dark:text-slate-400">{t(isMgr?'Manager':'Receptionist')}</div></div>
          <div className="flex rounded-lg border border-slate-300 dark:border-slate-600 overflow-hidden" role="group" aria-label="Language">{LANGS.map(([c,l])=>(<button key={c} onClick={()=>setLang(c)} className={'px-3 py-2 text-sm '+(lang===c?'bg-brass text-ink font-semibold':'')}>{l}</button>))}</div>
          <button className={btn2+' !py-2 text-sm'} onClick={()=>setDark(!dark)}>{dark?t('Light'):t('Dark')}</button>
          <button className={btn2+' !py-2 text-sm'} onClick={()=>auth.signOut()}>{t('Sign out')}</button>
        </div>
      </header>
      <main className="px-4 md:px-8">
        {noRooms?(isMgr?<Card title={t('Hotel setup')}><p className="mb-3">{t('No rooms yet. Create the rooms to start.')}</p><button className={btn} onClick={()=>A.initRooms()}>{t('Create {0} rooms',CONFIG.floors.length*CONFIG.roomsPerFloor)}</button></Card>:<Card><p>{t('The manager has not set up the rooms yet.')}</p></Card>):(<>
          {tab==='dash'&&isMgr&&<Dashboard {...P} openPolice={()=>setPolice(true)}/>}{tab==='desk'&&<ReceptionTab {...P}/>}{tab==='rooms'&&<RoomsTab {...P}/>}{tab==='shift'&&<ShiftTab {...P}/>}{tab==='inc'&&<IncidentsTab {...P}/>}{tab==='arch'&&isMgr&&<ArchiveTab/>}</>)}
      </main>
    </div>
    <nav className={'md:hidden fixed bottom-0 inset-x-0 bg-ink text-slate-300 grid border-t border-white/10 '+(isMgr?'grid-cols-6':'grid-cols-4')} style={{paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
      {tabs.map(([k,l,i])=>(<button key={k} onClick={()=>setTab(k)} className={'py-2.5 text-xs flex flex-col items-center gap-0.5 '+(tab===k?'text-brass font-semibold':'')}><span className="text-lg leading-none">{i}</span>{t(l)}</button>))}
    </nav>
    {police&&<Police s={s} onClose={()=>setPolice(false)}/>}
    {msg&&<div role="status" className="fixed top-4 left-1/2 -translate-x-1/2 z-[70] rounded-lg bg-brass text-ink px-4 py-2.5 shadow-lg text-sm font-medium max-w-[90vw]" style={{marginTop:'env(safe-area-inset-top,0px)'}}>{msg}</div>}
  </div></Ctx.Provider>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
